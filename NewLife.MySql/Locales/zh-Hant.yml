"NewLife MySQL Driver": "新生命MySQL驅動"
"Pure C# high-performance MySQL ADO.NET driver. Zero third-party dependencies, full async/await, Pipelined Batch Execution for 2~3× faster batch DML. MIT license. Supports net45~net10, MySQL 5.x~9.0+, OceanBase, TiDB, Doris, Aurora, CloudSQL; NativeAOT compatible on net8.0+; OpenTelemetry-compatible tracing (ActivitySource) on net6.0+.": "純 C# 高效能 MySQL ADO.NET 驅動。零第三方相依、全非同步/await、管線化批次執行讓批次 DML 提速 2~3 倍。MIT 授權。支援 net45~net10、MySQL 5.x~9.0+、OceanBase、TiDB、Doris、Aurora、CloudSQL；net8.0+ 相容 NativeAOT；net6.0+ 提供相容 OpenTelemetry 的鏈路追蹤（ActivitySource）。"
