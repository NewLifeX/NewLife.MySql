# 日本語 词表（ja）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Authentication failed.": "認証に失敗しました。"
"WebAuthn: the server did not provide a valid challenge or rpId.": "WebAuthn: サーバーが有効なチャレンジまたは rpId を提供しませんでした。"
"WebAuthn authentication failed.": "WebAuthn 認証に失敗しました。"
"Unable to obtain the current binlog position; make sure binlog is enabled.": "現在の binlog 位置を取得できません。binlog が有効になっていることを確認してください。"
"The connection has not been set.": "接続が設定されていません。"
"There are no commands to execute.": "実行するコマンドがありません。"
"DestinationTableName cannot be empty.": "DestinationTableName は空にできません。"
"Connection cannot be empty.": "接続は空にできません。"
"Unable to create MySqlCommand.": "MySqlCommand を作成できません。"
"CommandText cannot be empty.": "CommandText は空にできません。"
"Connection is not open.": "接続が開かれていません。"
"MySqlCommand.Cancel is not implemented yet, so the running command cannot be canceled.": "MySqlCommand.Cancel は未実装のため、実行中のコマンドをキャンセルできません。"
"The database connection has been closed.": "データベース接続が切断されました。"
"Parameter must be of type MySqlParameter.": "パラメーターは MySqlParameter 型である必要があります。"
"Parameter '{0}' was not found.": "パラメーター '{0}' が見つかりませんでした。"
"Connection string cannot be empty.": "接続文字列を空にすることはできません。"
"The connection was closed unexpectedly while reading a MySQL packet.": "MySQL パケットの読み取り中に接続が予期せず閉じられました。"
"Server address is not specified (Server or Socket).": "サーバーアドレスが指定されていません（Server または Socket）。"
"Unix socket connection to {0} timed out ({1}ms).": "Unix ソケット接続 {0} がタイムアウトしました（{1}ms）。"
"Unix domain sockets are only supported on .NET 5.0+ platforms (Linux/macOS).": "Unix ドメインソケットは .NET 5.0+ プラットフォーム（Linux/macOS）でのみサポートされます。"
"Connection to {0}:{1} timed out ({2}ms).": "{0}:{1} への接続がタイムアウトしました（{2}ms）。"
"The server does not support SSL connections.": "サーバーは SSL 接続をサポートしていません。"
"Unsupported authentication method: {0}.": "サポートされていない認証方式です: {0}。"
"Packet size ({0}) exceeds the maximum allowed ({1}).": "パケットサイズ（{0}）が上限（{1}）を超えています。"
"Timed out reading a packet ({0}s).": "パケットの読み取りがタイムアウトしました（{0}s）。"
"Decompressed packet size ({0}) exceeds the maximum allowed ({1}).": "解凍後のパケットサイズ（{0}）が上限（{1}）を超えています。"
"Compressed packet size ({0}) exceeds the maximum allowed ({1}).": "圧縮パケットサイズ（{0}）が上限（{1}）を超えています。"
"Row packet size ({0}) exceeds the maximum allowed ({1}).": "行パケットサイズ（{0}）が上限（{1}）を超えています。"
"Failed to change the current database.": "現在のデータベースの切り替えに失敗しました。"
"Failed to create the database.": "データベースの作成に失敗しました。"
"Failed to drop the database.": "データベースの削除に失敗しました。"
"Failed to kill the thread.": "スレッドの終了に失敗しました。"
"Failed to register the replica.": "レプリカの登録に失敗しました。"
"Field value length ({0}) exceeds the maximum allowed ({1}).": "フィールド値の長さ（{0}）が上限（{1}）を超えています。"
"Unsupported isolation level: {0}.": "サポートされていない分離レベルです: {0}。"
"Resource {0} not found in {1}.": "リソース {0} が {1} に見つかりません。"
"Transaction has already been committed or is not pending.": "トランザクションは既にコミットされているか、保留中ではありません。"
"Binlog read error; reconnecting in {0}ms: {1}": "Binlog 読み取りエラー。{0}ms 後に再接続します: {1}"
"Started subscribing to binlog: {0} ServerId={1}": "Binlog の購読を開始しました: {0} ServerId={1}"
"Event handler error: {0}": "イベントハンドラーエラー: {0}"
"Binlog reconnected: {0}": "Binlog に再接続しました: {0}"
"MySQL network connection lost, reconnecting after {0}ms ({1}: {2})": "MySQL のネットワーク接続が切断されました。{0}ms 後に再接続します（{1}: {2}）"
