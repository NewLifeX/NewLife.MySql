"Pure C# high-performance MySQL ADO.NET driver. Zero third-party dependencies, full async/await, Pipelined Batch Execution for 2~3× faster batch DML. MIT license. Supports net45~net10, MySQL 5.x~9.0+, OceanBase, TiDB, Doris, Aurora, CloudSQL; NativeAOT compatible on net8.0+; OpenTelemetry-compatible tracing (ActivitySource) on net6.0+.": "Reiner C#-Hochleistungs-ADO.NET-Treiber für MySQL. Keine Abhängigkeiten von Drittanbietern, vollständiges async/await, pipelined Batch-Ausführung für 2~3× schnellere Batch-DML. MIT-Lizenz. Unterstützt net45~net10, MySQL 5.x~9.0+, OceanBase, TiDB, Doris, Aurora, CloudSQL; NativeAOT-kompatibel ab net8.0+; OpenTelemetry-kompatibles Tracing (ActivitySource) ab net6.0+."
