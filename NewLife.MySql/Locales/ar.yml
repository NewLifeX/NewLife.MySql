# العربية 词表（ar）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Authentication failed.": "فشلت المصادقة."
"WebAuthn: the server did not provide a valid challenge or rpId.": "WebAuthn: لم يوفّر الخادم تحديًا أو rpId صالحًا."
"WebAuthn authentication failed.": "فشلت مصادقة WebAuthn."
"Unable to obtain the current binlog position; make sure binlog is enabled.": "تعذّر الحصول على موضع binlog الحالي؛ تأكد من تمكين binlog."
"The connection has not been set.": "لم يتم تعيين الاتصال."
"There are no commands to execute.": "لا توجد أوامر لتنفيذها."
"DestinationTableName cannot be empty.": "لا يمكن أن يكون DestinationTableName فارغًا."
"Connection cannot be empty.": "لا يمكن أن يكون الاتصال فارغًا."
"Unable to create MySqlCommand.": "تعذّر إنشاء MySqlCommand."
"CommandText cannot be empty.": "لا يمكن أن يكون CommandText فارغًا."
"Connection is not open.": "الاتصال غير مفتوح."
"MySqlCommand.Cancel is not implemented yet, so the running command cannot be canceled.": "لم يتم تنفيذ MySqlCommand.Cancel بعد، لذا لا يمكن إلغاء الأمر الجاري."
"The database connection has been closed.": "تم إغلاق اتصال قاعدة البيانات."
"Parameter must be of type MySqlParameter.": "يجب أن تكون المعلمة من النوع MySqlParameter."
"Parameter '{0}' was not found.": "لم يتم العثور على المعلمة '{0}'."
"Connection string cannot be empty.": "لا يمكن أن تكون سلسلة الاتصال فارغة."
"The connection was closed unexpectedly while reading a MySQL packet.": "تم إغلاق الاتصال بشكل غير متوقع أثناء قراءة حزمة MySQL."
"Server address is not specified (Server or Socket).": "لم يتم تحديد عنوان الخادم (Server أو Socket)."
"Unix socket connection to {0} timed out ({1}ms).": "انتهت مهلة الاتصال بمقبس Unix {0} ({1}ms)."
"Unix domain sockets are only supported on .NET 5.0+ platforms (Linux/macOS).": "مقابس نطاق Unix مدعومة فقط على منصات .NET 5.0+ (Linux/macOS)."
"Connection to {0}:{1} timed out ({2}ms).": "انتهت مهلة الاتصال بـ {0}:{1} ({2}ms)."
"The server does not support SSL connections.": "الخادم لا يدعم اتصالات SSL."
"Unsupported authentication method: {0}.": "طريقة مصادقة غير مدعومة: {0}."
"Packet size ({0}) exceeds the maximum allowed ({1}).": "حجم الحزمة ({0}) يتجاوز الحد الأقصى المسموح ({1})."
"Timed out reading a packet ({0}s).": "انتهت مهلة قراءة الحزمة ({0}s)."
"Decompressed packet size ({0}) exceeds the maximum allowed ({1}).": "حجم الحزمة بعد فك الضغط ({0}) يتجاوز الحد الأقصى المسموح ({1})."
"Compressed packet size ({0}) exceeds the maximum allowed ({1}).": "حجم الحزمة المضغوطة ({0}) يتجاوز الحد الأقصى المسموح ({1})."
"Row packet size ({0}) exceeds the maximum allowed ({1}).": "حجم حزمة الصف ({0}) يتجاوز الحد الأقصى المسموح ({1})."
"Failed to change the current database.": "تعذر تغيير قاعدة البيانات الحالية."
"Failed to create the database.": "تعذر إنشاء قاعدة البيانات."
"Failed to drop the database.": "تعذر حذف قاعدة البيانات."
"Failed to kill the thread.": "تعذر إنهاء الخيط."
"Failed to register the replica.": "تعذر تسجيل النسخة المتماثلة."
"Field value length ({0}) exceeds the maximum allowed ({1}).": "طول قيمة الحقل ({0}) يتجاوز الحد الأقصى المسموح ({1})."
"Unsupported isolation level: {0}.": "مستوى عزل غير مدعوم: {0}."
"Resource {0} not found in {1}.": "المورد {0} غير موجود في {1}."
"Transaction has already been committed or is not pending.": "تم تأكيد المعاملة بالفعل أو أنها ليست معلّقة."
"Binlog read error; reconnecting in {0}ms: {1}": "خطأ في قراءة binlog؛ إعادة الاتصال خلال {0}ms: {1}"
"Started subscribing to binlog: {0} ServerId={1}": "بدأ الاشتراك في binlog: {0} ServerId={1}"
"Event handler error: {0}": "خطأ في معالج الأحداث: {0}"
"Binlog reconnected: {0}": "تمت إعادة الاتصال بـ binlog: {0}"
"MySQL network connection lost, reconnecting after {0}ms ({1}: {2})": "فُقد اتصال شبكة MySQL؛ إعادة الاتصال بعد {0}ms ({1}: {2})"
"[MySqlSsl] db={0} server={1}:{2} SslMode=Preferred skip TLS and use cached plain-text fallback": "[MySqlSsl] db={0} server={1}:{2} SslMode=Preferred تخطي TLS واستخدام النص العادي الاحتياطي المخزّن مؤقتًا"
"[MySqlSsl] db={0} server={1}:{2} SslMode=Preferred fallback to plain text: {3}: {4}": "[MySqlSsl] db={0} server={1}:{2} SslMode=Preferred الرجوع إلى النص العادي: {3}: {4}"
"SQL: {0}": "SQL: {0}"
"BatchCount: {0}": "عدد الدفعات: {0}"
