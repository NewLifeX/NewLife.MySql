"Pure C# high-performance MySQL ADO.NET driver. Zero third-party dependencies, full async/await, Pipelined Batch Execution for 2~3× faster batch DML. MIT license. Supports net45~net10, MySQL 5.x~9.0+, OceanBase, TiDB, Doris, Aurora, CloudSQL; NativeAOT compatible on net8.0+; OpenTelemetry-compatible tracing (ActivitySource) on net6.0+.": "Высокопроизводительный драйвер ADO.NET для MySQL на чистом C#. Без сторонних зависимостей, полная поддержка async/await, конвейерное пакетное выполнение (Pipelined Batch Execution) ускоряет пакетные операции DML в 2~3 раза. Лицензия MIT. Поддерживает net45~net10, MySQL 5.x~9.0+, OceanBase, TiDB, Doris, Aurora, CloudSQL; совместим с NativeAOT на net8.0+; трассировка, совместимая с OpenTelemetry (ActivitySource), на net6.0+."
