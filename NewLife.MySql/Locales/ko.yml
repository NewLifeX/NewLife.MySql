# 한국어 词表（ko）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Authentication failed.": "인증에 실패했습니다."
"WebAuthn: the server did not provide a valid challenge or rpId.": "WebAuthn: 서버가 유효한 챌린지 또는 rpId를 제공하지 않았습니다."
"WebAuthn authentication failed.": "WebAuthn 인증에 실패했습니다."
