name: aot

on:
  push:
    branches: [ master, dev ]
    paths:
      - 'NewLife.MySql/**'
      - 'AotSmoke/**'
      - '.github/workflows/aot.yml'
  pull_request:
    paths:
      - 'NewLife.MySql/**'
      - 'AotSmoke/**'
      - '.github/workflows/aot.yml'
  workflow_dispatch:

jobs:
  analyzer:
    name: 裁剪/AOT 分析器（0 告警）
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: 构建驱动与 EF Core 提供程序（net8.0 / net10.0）并校验 0 条 IL 告警
      run: |
        set -o pipefail
        for proj in NewLife.MySql/NewLife.MySql.csproj NewLife.MySql.EntityFrameworkCore/NewLife.MySql.EntityFrameworkCore.csproj; do
          for tfm in net8.0 net10.0; do
            echo "===== ${proj} ${tfm} ====="
            log="build-$(basename ${proj} .csproj)-${tfm}.log"
            dotnet build "${proj}" -f ${tfm} -c Release -v n 2>&1 | tee "${log}"
            if grep -nE 'warning IL[0-9]{4}' "${log}"; then
              echo "::error::${proj} ${tfm} 存在裁剪/AOT 告警，处理方式见 Doc/AOT兼容性评估.md"
              exit 1
            fi
          done
        done
        echo "裁剪/AOT 告警检查通过：0 条"

  native-smoke:
    name: NativeAOT 冒烟（linux-x64 + MySQL 8）
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: 安装 NativeAOT 依赖（clang / zlib）
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    # 运行器自带 MySQL 8.0（root/root，默认未启动），冒烟依赖本机 3306
    - name: 启动 MySQL
      run: |
        sudo systemctl start mysql.service
        for i in $(seq 1 30); do
          if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent 2>/dev/null; then break; fi
          sleep 2
        done
        mysql -h 127.0.0.1 -uroot -proot -e "SELECT VERSION()"
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: NativeAOT 发布并校验 0 条 ILC 告警
      run: |
        set -o pipefail
        dotnet publish AotSmoke/AotSmoke.csproj -c Release -r linux-x64 -o out 2>&1 | tee publish.log
        if grep -nE 'warning IL[0-9]{4}' publish.log; then
          echo "::error::NativeAOT 发布存在 IL 告警，处理方式见 Doc/AOT兼容性评估.md"
          exit 1
        fi
    - name: 运行原生冒烟（20 场景 + 4 纯内存场景）
      env:
        MYSQL_CONN: "Server=127.0.0.1;Port=3306;Database=mysql;User Id=root;Password=root;"
      run: ./out/AotSmoke

  native-smoke-windows:
    name: NativeAOT 冒烟（win-x64，无数据库场景）
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: NativeAOT 发布并校验 0 条 ILC 告警
      shell: pwsh
      run: |
        dotnet publish AotSmoke/AotSmoke.csproj -c Release -r win-x64 -o out | Tee-Object -FilePath publish-win.log
        if (Select-String -Path publish-win.log -Pattern 'warning IL\d{4}') {
          Write-Error "NativeAOT 发布存在 IL 告警，处理方式见 Doc/AOT兼容性评估.md"
          exit 1
        }
    # 运行器 MySQL 是否可用随镜像变化，此处固定运行不依赖数据库的场景（S13 与 P1~P4）
    - name: 运行原生冒烟（--no-db）
      shell: pwsh
      run: ./out/AotSmoke.exe --no-db
