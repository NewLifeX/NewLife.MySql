name: mobile

on:
  # 移动端冒烟为观察期作业（模拟器/工作负载版本随镜像滚动），主干 push 不跑；改由夜间定时与手动触发
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  # Android 模拟器：启动 APK 执行冒烟，logcat 出现 SMOKE_OK 即通过。
  # 观察期（continue-on-error），稳定全绿后转阻断。
  android:
    name: android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
    - uses: actions/checkout@v7
    - name: Setup dotNET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Install Android workload
      run: dotnet workload install android || sudo dotnet workload install android
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Run Android smoke
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 36
        target: google_apis
        arch: x86_64
        disable-animations: true
        script: pwsh ./Samples/MobileSmoke/run-android.ps1 -Configuration Release
    - name: Upload Android artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: mobile-android
        path: Bin/MobileSmoke/**/*.apk
        if-no-files-found: ignore

  # iOS 模拟器：构建 .app 并安装运行，读取应用容器内的 smoke.json。
  ios:
    name: ios simulator
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
    - uses: actions/checkout@v7
    - name: Setup dotNET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Select Xcode
      # runner 镜像的 Xcode 版本随镜像滚动，取已安装的最新版，避免硬编码版本号失效
      run: |
        latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
        echo "Selected $latest"
        sudo xcode-select -s "$latest"
    - name: Install iOS workload
      run: dotnet workload install ios || sudo dotnet workload install ios
    - name: Run iOS smoke
      run: bash ./Samples/MobileSmoke/run-ios.sh
    - name: Upload iOS artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: mobile-ios
        path: Bin/MobileSmoke/artifacts/**
        if-no-files-found: ignore
